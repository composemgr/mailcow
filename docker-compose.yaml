# nginx proxy address - http://172.17.0.1:61028

name: mailcow
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

x-env: &default-env
  TZ: ${TZ:-America/New_York}
  IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
  IPV6_NETWORK: ${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
  DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
  DBUSER: ${DB_USER_NAME:-mailcow}
  DBPASS: ${DB_USER_PASS:-changeme_db_password}
  DBROOT: ${DB_ADMIN_PASS:-changeme_admin_password}
  REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
  MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
  LOG_LINES: ${LOG_LINES:-9999}
  COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailcow}

services:
  unbound-mailcow:
    image: ghcr.io/mailcow/unbound:1.24
    restart: always
    pull_policy: always
    tty: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      SKIP_UNBOUND_HEALTHCHECK: ${SKIP_UNBOUND_HEALTHCHECK:-n}
    volumes:
      - './volumes/data/hooks/unbound:/hooks:Z'
      - './volumes/data/conf/unbound/unbound.conf:/etc/unbound/unbound.conf:ro,Z'
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.254
        aliases:
          - unbound

  mysql-mailcow:
    image: mariadb:10.11
    stop_grace_period: 45s
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      MYSQL_ROOT_PASSWORD: ${DBROOT:-changeme_admin_password}
      MYSQL_DATABASE: ${DBNAME:-mailcow}
      MYSQL_USER: ${DBUSER:-mailcow}
      MYSQL_PASSWORD: ${DBPASS:-changeme_db_password}
      MYSQL_INITDB_SKIP_TZINFO: 1
    ports:
      - '${SQL_PORT:-127.0.0.1:13306}:3306'
    volumes:
      - mysql-vol-1:/var/lib/mysql/
      - mysql-socket-vol-1:/var/run/mysqld/
      - './volumes/data/conf/mysql/:/etc/mysql/conf.d/:ro,Z'
    networks:
      mailcow-network:
        aliases:
          - mysql
    depends_on:
      - unbound-mailcow
      - netfilter-mailcow

  redis-mailcow:
    image: redis:7.4.2-alpine
    restart: always
    pull_policy: always
    entrypoint: ['/bin/sh', '/redis-conf.sh']
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      REDISMASTERPASS: ${REDISMASTERPASS:-}
    ports:
      - '${REDIS_PORT:-127.0.0.1:7654}:6379'
    sysctls:
      - net.core.somaxconn=4096
    volumes:
      - redis-vol-1:/data/
      - './volumes/data/conf/redis/redis-conf.sh:/redis-conf.sh:z'
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.249
        aliases:
          - redis
    depends_on:
      - netfilter-mailcow

  clamd-mailcow:
    image: ghcr.io/mailcow/clamd:1.70
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      SKIP_CLAMD: ${SKIP_CLAMD:-n}
    volumes:
      - clamd-db-vol-1:/var/lib/clamav
      - './volumes/data/conf/clamav/:/etc/clamav/:Z'
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - clamd
    depends_on:
      unbound-mailcow:
        condition: service_healthy

  rspamd-mailcow:
    image: ghcr.io/mailcow/rspamd:2.2
    hostname: rspamd
    restart: always
    pull_policy: always
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      IPV6_NETWORK: ${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      SPAMHAUS_DQS_KEY: ${SPAMHAUS_DQS_KEY:-}
    volumes:
      - './volumes/data/hooks/rspamd:/hooks:Z'
      - './volumes/data/conf/rspamd/custom/:/etc/rspamd/custom:z'
      - './volumes/data/conf/rspamd/override.d/:/etc/rspamd/override.d:Z'
      - './volumes/data/conf/rspamd/local.d/:/etc/rspamd/local.d:Z'
      - './volumes/data/conf/rspamd/plugins.d/:/etc/rspamd/plugins.d:Z'
      - './volumes/data/conf/rspamd/lua/:/etc/rspamd/lua/:ro,Z'
      - './volumes/data/conf/rspamd/rspamd.conf.local:/etc/rspamd/rspamd.conf.local:Z'
      - './volumes/data/conf/rspamd/rspamd.conf.override:/etc/rspamd/rspamd.conf.override:Z'
      - rspamd-vol-1:/var/lib/rspamd
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - rspamd
    depends_on:
      - dovecot-mailcow
      - clamd-mailcow

  php-fpm-mailcow:
    image: ghcr.io/mailcow/phpfpm:1.93
    restart: always
    pull_policy: always
    command: 'php-fpm -d date.timezone=${TZ:-America/New_York} -d expose_php=0'
    logging: *default-logging
    environment:
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      LOG_LINES: ${LOG_LINES:-9999}
      TZ: ${TZ:-America/New_York}
      DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
      DBUSER: ${DB_USER_NAME:-mailcow}
      DBPASS: ${DB_USER_PASS:-changeme_db_password}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      MAILCOW_PASS_SCHEME: ${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
      IMAP_PORT: ${IMAP_PORT:-143}
      IMAPS_PORT: ${IMAPS_PORT:-993}
      POP_PORT: ${POP_PORT:-110}
      POPS_PORT: ${POPS_PORT:-995}
      SIEVE_PORT: ${SIEVE_PORT:-4190}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      IPV6_NETWORK: ${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
      SUBMISSION_PORT: ${SUBMISSION_PORT:-587}
      SMTPS_PORT: ${SMTPS_PORT:-465}
      SMTP_PORT: ${SMTP_PORT:-25}
      API_KEY: ${APP_API_TOKEN:-invalid}
      API_KEY_READ_ONLY: ${API_KEY_READ_ONLY:-invalid}
      API_ALLOW_FROM: ${API_ALLOW_FROM:-invalid}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
      SKIP_FTS: ${SKIP_FTS:-y}
      SKIP_CLAMD: ${SKIP_CLAMD:-n}
      SKIP_OLEFY: ${SKIP_OLEFY:-n}
      SKIP_SOGO: ${SKIP_SOGO:-n}
      ALLOW_ADMIN_EMAIL_LOGIN: ${ALLOW_ADMIN_EMAIL_LOGIN:-n}
      MASTER: ${MASTER:-y}
      DEV_MODE: ${DEV_MODE:-n}
      DEMO_MODE: ${DEMO_MODE:-n}
      WEBAUTHN_ONLY_TRUSTED_VENDORS: ${WEBAUTHN_ONLY_TRUSTED_VENDORS:-n}
      CLUSTERMODE: ${CLUSTERMODE:-}
      ADDITIONAL_SERVER_NAMES: ${ADDITIONAL_SERVER_NAMES:-}
    volumes:
      - './volumes/data/hooks/phpfpm:/hooks:Z'
      - './volumes/data/web:/web:z'
      - './volumes/data/conf/rspamd/dynmaps:/dynmaps:ro,z'
      - './volumes/data/conf/rspamd/custom/:/rspamd_custom_maps:z'
      - './volumes/data/conf/dovecot/auth/mailcowauth.php:/mailcowauth/mailcowauth.php:z'
      - './volumes/data/web/inc/functions.inc.php:/mailcowauth/functions.inc.php:z'
      - './volumes/data/web/inc/functions.auth.inc.php:/mailcowauth/functions.auth.inc.php:z'
      - './volumes/data/web/inc/sessions.inc.php:/mailcowauth/sessions.inc.php:z'
      - './volumes/data/web/inc/functions.mailbox.inc.php:/mailcowauth/functions.mailbox.inc.php:z'
      - './volumes/data/web/inc/functions.ratelimit.inc.php:/mailcowauth/functions.ratelimit.inc.php:z'
      - './volumes/data/web/inc/functions.acl.inc.php:/mailcowauth/functions.acl.inc.php:z'
      - './volumes/data/conf/sogo/:/etc/sogo/:z'
      - './volumes/data/conf/rspamd/meta_exporter:/meta_exporter:ro,z'
      - './volumes/data/conf/phpfpm/crons:/crons:z'
      - './volumes/data/conf/phpfpm/sogo-sso/:/etc/sogo-sso/:z'
      - './volumes/data/conf/phpfpm/php-fpm.d/pools.conf:/usr/local/etc/php-fpm.d/z-pools.conf:Z'
      - './volumes/data/conf/phpfpm/php-conf.d/opcache-recommended.ini:/usr/local/etc/php/conf.d/opcache-recommended.ini:Z'
      - './volumes/data/conf/phpfpm/php-conf.d/upload.ini:/usr/local/etc/php/conf.d/upload.ini:Z'
      - './volumes/data/conf/phpfpm/php-conf.d/other.ini:/usr/local/etc/php/conf.d/zzz-other.ini:Z'
      - './volumes/data/conf/dovecot/global_sieve_before:/global_sieve/before:z'
      - './volumes/data/conf/dovecot/global_sieve_after:/global_sieve/after:z'
      - './volumes/data/assets/templates:/tpls:z'
      - './volumes/data/conf/nginx/:/etc/nginx/conf.d/:z'
      - rspamd-vol-1:/var/lib/rspamd
      - mysql-socket-vol-1:/var/run/mysqld/
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - phpfpm
    depends_on:
      - redis-mailcow
      ofelia.enabled: 'true'
      ofelia.job-exec.phpfpm_keycloak_sync.schedule: '@every 1m'
      ofelia.job-exec.phpfpm_keycloak_sync.no-overlap: 'true'
      ofelia.job-exec.phpfpm_keycloak_sync.command: '/bin/bash -c "php /crons/keycloak-sync.php || exit 0"'
      ofelia.job-exec.phpfpm_ldap_sync.schedule: '@every 1m'
      ofelia.job-exec.phpfpm_ldap_sync.no-overlap: 'true'
      ofelia.job-exec.phpfpm_ldap_sync.command: '/bin/bash -c "php /crons/ldap-sync.php || exit 0"'

  sogo-mailcow:
    image: ghcr.io/mailcow/sogo:1.133
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
      DBUSER: ${DB_USER_NAME:-mailcow}
      DBPASS: ${DB_USER_PASS:-changeme_db_password}
      TZ: ${TZ:-America/New_York}
      LOG_LINES: ${LOG_LINES:-9999}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      MAILCOW_PASS_SCHEME: ${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
      ACL_ANYONE: ${ACL_ANYONE:-disallow}
      ALLOW_ADMIN_EMAIL_LOGIN: ${ALLOW_ADMIN_EMAIL_LOGIN:-n}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      SOGO_EXPIRE_SESSION: ${SOGO_EXPIRE_SESSION:-480}
      SKIP_SOGO: ${SKIP_SOGO:-n}
      MASTER: ${MASTER:-y}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
    volumes:
      - './volumes/data/hooks/sogo:/hooks:Z'
      - './volumes/data/conf/sogo/:/etc/sogo/:z'
      - './volumes/data/web/inc/init_db.inc.php:/init_db.inc.php:z'
      - './volumes/data/conf/sogo/custom-favicon.ico:/usr/lib/GNUstep/SOGo/WebServerResources/img/sogo.ico:z'
      - './volumes/data/conf/sogo/custom-shortlogo.svg:/usr/lib/GNUstep/SOGo/WebServerResources/img/sogo-compact.svg:z'
      - './volumes/data/conf/sogo/custom-fulllogo.svg:/usr/lib/GNUstep/SOGo/WebServerResources/img/sogo-full.svg:z'
      - './volumes/data/conf/sogo/custom-fulllogo.png:/usr/lib/GNUstep/SOGo/WebServerResources/img/sogo-logo.png:z'
      - './volumes/data/conf/sogo/custom-theme.js:/usr/lib/GNUstep/SOGo/WebServerResources/js/theme.js:z'
      - './volumes/data/conf/sogo/custom-sogo.js:/usr/lib/GNUstep/SOGo/WebServerResources/js/custom-sogo.js:z'
      - sogo-web-vol-1:/sogo_web
      - sogo-userdata-backup-vol-1:/sogo_backup
      - mysql-socket-vol-1:/var/run/mysqld/
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.248
        aliases:
          - sogo
      ofelia.enabled: 'true'
      ofelia.job-exec.sogo_sessions.schedule: '@every 1m'
      ofelia.job-exec.sogo_sessions.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool -v expire-sessions $${SOGO_EXPIRE_SESSION} || exit 0"'
      ofelia.job-exec.sogo_ealarms.schedule: '@every 1m'
      ofelia.job-exec.sogo_ealarms.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-ealarms-notify -p /etc/sogo/cron.creds || exit 0"'
      ofelia.job-exec.sogo_eautoreply.schedule: '@every 5m'
      ofelia.job-exec.sogo_eautoreply.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool update-autoreply -p /etc/sogo/cron.creds || exit 0"'
      ofelia.job-exec.sogo_backup.schedule: '@every 24h'
      ofelia.job-exec.sogo_backup.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu sogo /usr/sbin/sogo-tool backup /sogo_backup ALL || exit 0"'

  dovecot-mailcow:
    image: ghcr.io/mailcow/dovecot:2.33
    restart: always
    pull_policy: always
    tty: true
    cap_add:
      - NET_BIND_SERVICE
    ulimits:
      nproc: 65535
      nofile:
        soft: 20000
        hard: 40000
    logging: *default-logging
    environment:
      DOVECOT_MASTER_USER: ${DOVECOT_MASTER_USER:-}
      DOVECOT_MASTER_PASS: ${DOVECOT_MASTER_PASS:-}
      MAILCOW_REPLICA_IP: ${MAILCOW_REPLICA_IP:-}
      DOVEADM_REPLICA_PORT: ${DOVEADM_REPLICA_PORT:-}
      LOG_LINES: ${LOG_LINES:-9999}
      DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
      DBUSER: ${DB_USER_NAME:-mailcow}
      DBPASS: ${DB_USER_PASS:-changeme_db_password}
      TZ: ${TZ:-America/New_York}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      MAILCOW_PASS_SCHEME: ${MAILCOW_PASS_SCHEME:-BLF-CRYPT}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      ALLOW_ADMIN_EMAIL_LOGIN: ${ALLOW_ADMIN_EMAIL_LOGIN:-n}
      MAILDIR_GC_TIME: ${MAILDIR_GC_TIME:-7200}
      ACL_ANYONE: ${ACL_ANYONE:-disallow}
      SKIP_FTS: ${SKIP_FTS:-y}
      FTS_HEAP: ${FTS_HEAP:-512}
      FTS_PROCS: ${FTS_PROCS:-3}
      MAILDIR_SUB: ${MAILDIR_SUB:-}
      MASTER: ${MASTER:-y}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
    ports:
      - '${DOVEADM_PORT:-127.0.0.1:19991}:12345'
      - '${IMAP_PORT:-143}:143'
      - '${IMAPS_PORT:-993}:993'
      - '${POP_PORT:-110}:110'
      - '${POPS_PORT:-995}:995'
      - '${SIEVE_PORT:-4190}:4190'
    volumes:
      - './volumes/data/hooks/dovecot:/hooks:Z'
      - './volumes/data/conf/dovecot:/etc/dovecot:z'
      - './volumes/data/assets/ssl:/etc/ssl/mail/:ro,z'
      - './volumes/data/conf/sogo/:/etc/sogo/:z'
      - './volumes/data/conf/phpfpm/sogo-sso/:/etc/phpfpm/:z'
      - './volumes/data/conf/rspamd/custom/:/etc/rspamd/custom:z'
      - './volumes/data/assets/templates:/templates:z'
      - vmail-vol-1:/var/vmail
      - vmail-index-vol-1:/var/vmail_index
      - crypt-vol-1:/mail_crypt/
      - rspamd-vol-1:/var/lib/rspamd
      - mysql-socket-vol-1:/var/run/mysqld/
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.250
        aliases:
          - dovecot
    depends_on:
      - mysql-mailcow
      - netfilter-mailcow
      - redis-mailcow
      ofelia.enabled: 'true'
      ofelia.job-exec.dovecot_imapsync_runner.schedule: '@every 1m'
      ofelia.job-exec.dovecot_imapsync_runner.no-overlap: 'true'
      ofelia.job-exec.dovecot_imapsync_runner.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu nobody /usr/local/bin/imapsync_runner.pl || exit 0"'
      ofelia.job-exec.dovecot_trim_logs.schedule: '@every 1m'
      ofelia.job-exec.dovecot_trim_logs.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/trim_logs.sh || exit 0"'
      ofelia.job-exec.dovecot_quarantine.schedule: '@every 20m'
      ofelia.job-exec.dovecot_quarantine.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/quarantine_notify.py || exit 0"'
      ofelia.job-exec.dovecot_clean_q_aged.schedule: '@every 24h'
      ofelia.job-exec.dovecot_clean_q_aged.command: '/bin/bash -c "[[ $${MASTER} == y ]] && /usr/local/bin/gosu vmail /usr/local/bin/clean_q_aged.sh || exit 0"'
      ofelia.job-exec.dovecot_maildir_gc.schedule: '@every 30m'
      ofelia.job-exec.dovecot_maildir_gc.command: '/bin/bash -c "source /source_env.sh ; /usr/local/bin/gosu vmail /usr/local/bin/maildir_gc.sh"'
      ofelia.job-exec.dovecot_sarules.schedule: '@every 24h'
      ofelia.job-exec.dovecot_sarules.command: '/bin/bash -c "/usr/local/bin/sa-rules.sh"'
      ofelia.job-exec.dovecot_fts.schedule: '@every 24h'
      ofelia.job-exec.dovecot_fts.command: '/bin/bash -c "/usr/local/bin/gosu vmail /usr/local/bin/optimize-fts.sh"'
      ofelia.job-exec.dovecot_repl_health.schedule: '@every 5m'
      ofelia.job-exec.dovecot_repl_health.command: '/bin/bash -c "/usr/local/bin/gosu vmail /usr/local/bin/repl_health.sh"'

  postfix-mailcow:
    image: ghcr.io/mailcow/postfix:1.80
    restart: always
    cap_add:
      - NET_BIND_SERVICE
    environment:
      LOG_LINES: ${LOG_LINES:-9999}
      TZ: ${TZ:-America/New_York}
      DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
      DBUSER: ${DB_USER_NAME:-mailcow}
      DBPASS: ${DB_USER_PASS:-changeme_db_password}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      SPAMHAUS_DQS_KEY: ${SPAMHAUS_DQS_KEY:-}
    ports:
      - '${SMTP_PORT:-25}:25'
      - '${SMTPS_PORT:-465}:465'
      - '${SUBMISSION_PORT:-587}:587'
    volumes:
      - './volumes/data/hooks/postfix:/hooks:Z'
      - './volumes/data/conf/postfix:/opt/postfix/conf:z'
      - './volumes/data/assets/ssl:/etc/ssl/mail/:ro,z'
      - postfix-vol-1:/var/spool/postfix
      - crypt-vol-1:/var/lib/zeyple
      - rspamd-vol-1:/var/lib/rspamd
      - mysql-socket-vol-1:/var/run/mysqld/
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        ipv4_address: ${IPV4_NETWORK:-172.22.1}.253
        aliases:
          - postfix
    depends_on:
      mysql-mailcow:
        condition: service_started
      unbound-mailcow:
        condition: service_healthy

  memcached-mailcow:
    image: memcached:alpine
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
    networks:
      mailcow-network:
        aliases:
          - memcached

  nginx-mailcow:
    image: ghcr.io/mailcow/nginx:1.03
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      HTTP_PORT: 80
      HTTPS_PORT: 443
      HTTP_REDIRECT: ${HTTP_REDIRECT:-n}
      DISABLE_IPv6: ${DISABLE_IPv6:-n}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      ADDITIONAL_SERVER_NAMES: ${ADDITIONAL_SERVER_NAMES:-}
      SKIP_SOGO: ${SKIP_SOGO:-n}
      SKIP_RSPAMD: ${SKIP_RSPAMD:-n}
      PHPFPMHOST: ${PHPFPMHOST:-}
      SOGOHOST: ${SOGOHOST:-}
      RSPAMDHOST: ${RSPAMDHOST:-}
      REDISHOST: ${REDISHOST:-}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      NGINX_USE_PROXY_PROTOCOL: ${NGINX_USE_PROXY_PROTOCOL:-n}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    ports:
      - '172.17.0.1:61028:80'
      - '172.17.0.1:61028:443'
    volumes:
      - './volumes/data/web:/web:ro,z'
      - './volumes/data/conf/rspamd/dynmaps:/dynmaps:ro,z'
      - './volumes/data/assets/ssl/:/etc/ssl/mail/:ro,z'
      - './volumes/data/conf/nginx/:/etc/nginx/conf.d/:z'
      - './volumes/data/conf/rspamd/meta_exporter:/meta_exporter:ro,z'
      - './volumes/data/conf/dovecot/auth/mailcowauth.php:/mailcowauth/mailcowauth.php:z'
      - './volumes/data/web/inc/functions.inc.php:/mailcowauth/functions.inc.php:z'
      - './volumes/data/web/inc/functions.auth.inc.php:/mailcowauth/functions.auth.inc.php:z'
      - './volumes/data/web/inc/sessions.inc.php:/mailcowauth/sessions.inc.php:z'
      - sogo-web-vol-1:/usr/lib/GNUstep/SOGo/
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - nginx
      proxy:
      cloudflare:
    depends_on:
      - redis-mailcow
      - php-fpm-mailcow
      - sogo-mailcow
      - rspamd-mailcow
    labels:
      - 'traefik.enable=true'
      - 'cloudflare.enable=true'
      - 'traefik.docker.network=proxy'
      - 'cloudflare.service=http://nginx-mailcow:80'
      - 'cloudflare.hostname=mailcow.${CLOUDFLARE_ZONE_NAME:-}'
      - 'traefik.http.routers.nginx-mailcow.entrypoints=http'
      - 'traefik.http.routers.nginx-mailcow-secure.tls=true'
      - 'traefik.http.routers.nginx-mailcow.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.middlewares.nginx-mailcow-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.routers.nginx-mailcow.middlewares=nginx-mailcow-https-redirect'
      - 'traefik.http.routers.nginx-mailcow-secure.entrypoints=https'
      - 'traefik.http.routers.nginx-mailcow-secure.rule=Host($(${BASE_HOST_NAME:-$HOSTNAME}))'
      - 'traefik.http.routers.nginx-mailcow-secure.tls.certresolver=cloudflare'
      - 'traefik.http.routers.nginx-mailcow-secure.service=nginx-mailcow'
      - 'traefik.http.services.nginx-mailcow.loadbalancer.server.port=80'

  acme-mailcow:
    image: ghcr.io/mailcow/acme:1.92
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      LOG_LINES: ${LOG_LINES:-9999}
      ACME_CONTACT: ${ACME_CONTACT:-}
      ADDITIONAL_SAN: ${ADDITIONAL_SAN:-}
      AUTODISCOVER_SAN: ${AUTODISCOVER_SAN:-y}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
      DBUSER: ${DB_USER_NAME:-mailcow}
      DBPASS: ${DB_USER_PASS:-changeme_db_password}
      SKIP_LETS_ENCRYPT: ${SKIP_LETS_ENCRYPT:-n}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
      DIRECTORY_URL: ${DIRECTORY_URL:-}
      ENABLE_SSL_SNI: ${ENABLE_SSL_SNI:-n}
      SKIP_IP_CHECK: ${SKIP_IP_CHECK:-n}
      SKIP_HTTP_VERIFICATION: ${SKIP_HTTP_VERIFICATION:-n}
      ONLY_MAILCOW_HOSTNAME: ${ONLY_MAILCOW_HOSTNAME:-n}
      LE_STAGING: ${LE_STAGING:-n}
      TZ: ${TZ:-America/New_York}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      SNAT_TO_SOURCE: ${SNAT_TO_SOURCE:-n}
      SNAT6_TO_SOURCE: ${SNAT6_TO_SOURCE:-n}
    volumes:
      - './volumes/data/web/.well-known/acme-challenge:/var/www/acme:z'
      - './volumes/data/assets/ssl:/var/lib/acme/:z'
      - './volumes/data/assets/ssl-example:/var/lib/ssl-example/:ro,Z'
      - mysql-socket-vol-1:/var/run/mysqld/
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - acme
    depends_on:
      nginx-mailcow:
        condition: service_started
      unbound-mailcow:
        condition: service_healthy

  netfilter-mailcow:
    image: ghcr.io/mailcow/netfilter:1.61
    restart: always
    pull_policy: always
    network_mode: 'host'
    privileged: true
    stop_grace_period: 30s
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      IPV6_NETWORK: ${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
      SNAT_TO_SOURCE: ${SNAT_TO_SOURCE:-n}
      SNAT6_TO_SOURCE: ${SNAT6_TO_SOURCE:-n}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      MAILCOW_REPLICA_IP: ${MAILCOW_REPLICA_IP:-}
      DISABLE_NETFILTER_ISOLATION_RULE: ${DISABLE_NETFILTER_ISOLATION_RULE:-n}
    volumes:
      - /lib/modules:/lib/modules:ro

  watchdog-mailcow:
    image: ghcr.io/mailcow/watchdog:2.08
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      IPV6_NETWORK: ${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
      LOG_LINES: ${LOG_LINES:-9999}
      TZ: ${TZ:-America/New_York}
      DBNAME: ${DB_CREATE_DATABASE_NAME:-mailcow}
      DBUSER: ${DB_USER_NAME:-mailcow}
      DBPASS: ${DB_USER_PASS:-changeme_db_password}
      DBROOT: ${DB_ADMIN_PASS:-changeme_admin_password}
      USE_WATCHDOG: ${USE_WATCHDOG:-n}
      WATCHDOG_NOTIFY_EMAIL: ${WATCHDOG_NOTIFY_EMAIL:-}
      WATCHDOG_NOTIFY_BAN: ${WATCHDOG_NOTIFY_BAN:-y}
      WATCHDOG_NOTIFY_START: ${WATCHDOG_NOTIFY_START:-y}
      WATCHDOG_SUBJECT: ${WATCHDOG_SUBJECT:-Watchdog ALERT}
      WATCHDOG_NOTIFY_WEBHOOK: ${WATCHDOG_NOTIFY_WEBHOOK:-}
      WATCHDOG_NOTIFY_WEBHOOK_BODY: ${WATCHDOG_NOTIFY_WEBHOOK_BODY:-}
      WATCHDOG_EXTERNAL_CHECKS: ${WATCHDOG_EXTERNAL_CHECKS:-n}
      WATCHDOG_MYSQL_REPLICATION_CHECKS: ${WATCHDOG_MYSQL_REPLICATION_CHECKS:-n}
      WATCHDOG_VERBOSE: ${WATCHDOG_VERBOSE:-n}
      MAILCOW_HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailcow-dockerized}
      IPV4_NETWORK: ${IPV4_NETWORK:-172.22.1}
      IP_BY_DOCKER_API: ${IP_BY_DOCKER_API:-0}
      CHECK_UNBOUND: ${CHECK_UNBOUND:-1}
      SKIP_CLAMD: ${SKIP_CLAMD:-n}
      SKIP_OLEFY: ${SKIP_OLEFY:-n}
      SKIP_LETS_ENCRYPT: ${SKIP_LETS_ENCRYPT:-n}
      SKIP_SOGO: ${SKIP_SOGO:-n}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
      EXTERNAL_CHECKS_THRESHOLD: ${EXTERNAL_CHECKS_THRESHOLD:-1}
      NGINX_THRESHOLD: ${NGINX_THRESHOLD:-5}
      UNBOUND_THRESHOLD: ${UNBOUND_THRESHOLD:-5}
      REDIS_THRESHOLD: ${REDIS_THRESHOLD:-5}
      MYSQL_THRESHOLD: ${MYSQL_THRESHOLD:-5}
      MYSQL_REPLICATION_THRESHOLD: ${MYSQL_REPLICATION_THRESHOLD:-1}
      SOGO_THRESHOLD: ${SOGO_THRESHOLD:-3}
      POSTFIX_THRESHOLD: ${POSTFIX_THRESHOLD:-8}
      CLAMD_THRESHOLD: ${CLAMD_THRESHOLD:-15}
      DOVECOT_THRESHOLD: ${DOVECOT_THRESHOLD:-12}
      DOVECOT_REPL_THRESHOLD: ${DOVECOT_REPL_THRESHOLD:-20}
      PHPFPM_THRESHOLD: ${PHPFPM_THRESHOLD:-5}
      RATELIMIT_THRESHOLD: ${RATELIMIT_THRESHOLD:-1}
      FAIL2BAN_THRESHOLD: ${FAIL2BAN_THRESHOLD:-1}
      ACME_THRESHOLD: ${ACME_THRESHOLD:-1}
      RSPAMD_THRESHOLD: ${RSPAMD_THRESHOLD:-5}
      OLEFY_THRESHOLD: ${OLEFY_THRESHOLD:-5}
      MAILQ_THRESHOLD: ${MAILQ_THRESHOLD:-20}
      MAILQ_CRIT: ${MAILQ_CRIT:-30}
    tmpfs:
      - /tmp
    volumes:
      - './volumes/data/assets/ssl:/etc/ssl/mail/:ro,z'
      - rspamd-vol-1:/var/lib/rspamd
      - mysql-socket-vol-1:/var/run/mysqld/
      - postfix-vol-1:/var/spool/postfix
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - watchdog
    depends_on:
      - postfix-mailcow
      - dovecot-mailcow
      - mysql-mailcow
      - acme-mailcow
      - redis-mailcow

  dockerapi-mailcow:
    image: ghcr.io/mailcow/dockerapi:2.11
    restart: always
    pull_policy: always
    security_opt:
      - label=disable
    logging: *default-logging
    environment:
      DBROOT: ${DB_ADMIN_PASS:-changeme_admin_password}
      TZ: ${TZ:-America/New_York}
      REDIS_SLAVEOF_IP: ${REDIS_SLAVEOF_IP:-}
      REDIS_SLAVEOF_PORT: ${REDIS_SLAVEOF_PORT:-}
      REDISPASS: ${APP_SECRET_KEY:-changeme_redis_password}
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    dns:
      - ${IPV4_NETWORK:-172.22.1}.254
    networks:
      mailcow-network:
        aliases:
          - dockerapi

  olefy-mailcow:
    image: ghcr.io/mailcow/olefy:1.15
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      OLEFY_BINDADDRESS: 0.0.0.0
      OLEFY_BINDPORT: 10055
      OLEFY_TMPDIR: /tmp
      OLEFY_PYTHON_PATH: /usr/bin/python3
      OLEFY_OLEVBA_PATH: /usr/bin/olevba
      OLEFY_LOGLVL: 20
      OLEFY_MINLENGTH: 500
      OLEFY_DEL_TMP: 1
      SKIP_OLEFY: ${SKIP_OLEFY:-n}
    networks:
      mailcow-network:
        aliases:
          - olefy

  ofelia-mailcow:
    image: mcuadros/ofelia:latest
    restart: always
    pull_policy: always
    security_opt:
      - label=disable
    command: daemon --docker -f label=com.docker.compose.project=${COMPOSE_PROJECT_NAME:-mailcow}
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-mailcow}
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    depends_on:
      - sogo-mailcow
      - dovecot-mailcow
    networks:
      mailcow-network:
        aliases:
          - ofelia
      ofelia.enabled: 'true'

  ipv6nat-mailcow:
    image: robbertkl/ipv6nat
    security_opt:
      - label=disable
    restart: always
    pull_policy: always
    privileged: true
    network_mode: 'host'
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
    volumes:
      - '/lib/modules:/lib/modules:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    depends_on:
      - unbound-mailcow
      - mysql-mailcow
      - redis-mailcow
      - clamd-mailcow
      - rspamd-mailcow
      - php-fpm-mailcow
      - sogo-mailcow
      - dovecot-mailcow
      - postfix-mailcow
      - memcached-mailcow
      - nginx-mailcow
      - acme-mailcow
      - netfilter-mailcow
      - watchdog-mailcow
      - dockerapi-mailcow

networks:
  mailcow-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-mailcow
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.22.1}.0/24
        - subnet: ${IPV6_NETWORK:-fd4d:6169:6c63:6f77::/64}
  proxy:
    external: true
  cloudflare:
    external: true

volumes:
  vmail-vol-1:
  vmail-index-vol-1:
  mysql-vol-1:
  mysql-socket-vol-1:
  redis-vol-1:
  rspamd-vol-1:
  postfix-vol-1:
  crypt-vol-1:
  sogo-web-vol-1:
  sogo-userdata-backup-vol-1:
  clamd-db-vol-1:
